[project]
name = "pkg-visualizer"
version = "0.2.0"
description = "A Python application for visualizing Python packages in 3D using PyVistaQt"
authors = [{ name = "Eric G. Suchanek, Ph.D", email = "suchanek@mac.com" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "asttokens",
    "markdown>=3.4",
    "numpy",
    "param",
    "pyvista[jupyter]>=0.49.0,<0.50.0",
    "rich>=14.0.0,<15.0.0",
    "pyqt5>=5.15.11,<6.0.0",
    "pyvistaqt>=0.13.0,<0.14.0",
    "vtk>=9.5.0,<9.8.0",
    # HTML export: trame-pyvista needs a trame-vtk that knows the VTK in use.
    "trame-vtk>=2.11.15",
]

[project.scripts]
pkg-visualizer = "pkg_visualizer.pkg_visualizer:main"
repovis = "pkg_visualizer.pkg_visualizer:main"

[tool.poetry]
packages = [{ include = "pkg_visualizer" }]

[tool.poetry.group.dev.dependencies]
pytest = "*"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
